data_config:
  target: 
    - "target_column" # Change this to your dataset's target column name
  continuous_cols:
    - "num_col_1"
    - "num_col_2"
    - "num_col_3"
    - "num_col_4"
    - "num_col_5"
    - "num_col_6"
    - "num_col_7"
    - "num_col_8"
  categorical_cols:
    - "cat_col_1"
    - "cat_col_2"
  normalize_continuous_features: true

trainer_config:
  batch_size: 1024
  max_epochs: 2
  early_stopping: "valid_loss"
  early_stopping_patience: 3
  checkpoints: "valid_loss"

optimizer_config:
  optimizer: Adam
  optimizer_params:
    weight_decay: 0.00001
  lr_scheduler: ReduceLROnPlateau
  lr_scheduler_params:
    patience: 2

model_config:
  # The model_type maps directly to a pytorch_tabular model.
  # Available options: DANet, CategoryEmbedding, NODE, TabNet, MDN, AutoInt, TabTransformer, FTTransformer, GATE, GANDALF, TabM
  model_type: TabM
  task: classification # Can be classification or regression
  learning_rate: 0.005
  
  # ====================================================================
  # Below are the model-specific configurations. Uncomment the fields 
  # for the model_type you selected and adjust their values as needed.
  # ====================================================================

  # --- TabM Specific Configs ---
  k: 5
  hidden_dim: 256
  num_layers: 3
  dropout: 0.1
  use_batch_norm: False

  # --- DANet Specific Configs ---
  #n_layers: 4
  #abstlay_dim_1: 32
  #abstlay_dim_2: 64
